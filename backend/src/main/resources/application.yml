server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agentguard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed by Supabase migrations

agentguard:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-min-32-chars}
    expiry-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8001}
  anomaly:
    scorer-timeout-ms: 3000
    threshold-high: 0.5      # risk tier -> anomaly score at/above which a case opens
    threshold-standard: 0.7
    threshold-low: 0.85
  # Phase 4 — LLM provider chain. All providers are FREE.
  # "auto" (default): prefer GROQ/GEMINI free-tier keys when set, else local Ollama.
  # Explicit "ollama"|"groq"|"gemini"|"openai" forces that provider (fails loudly if misconfigured).
  llm:
    provider: ${LLM_PROVIDER:auto}
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1:8b}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    embed-model: ${GEMINI_EMBED_MODEL:text-embedding-004}
mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8002}
    token: ${MCP_SERVER_TOKEN:}

logging:
  level:
    com.agentguard: INFO
