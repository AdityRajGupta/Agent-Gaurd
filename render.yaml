# AgentGuard on Render (free tier) — Phase 5
# 1. Create a free PostgreSQL on Render OR keep using Supabase (recommended:
#    Supabase — set DATABASE_URL below to your Supabase connection string).
# 2. `render blueprint launch` from the repo root, or "New Blueprint" in the dashboard.
# 3. Set the secret env vars (JWT_SECRET, GROQ_API_KEY / GEMINI_API_KEY optional).
# Frontend -> Vercel (see README "Deploy").

services:
  - type: web
    name: agentguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false            # jdbc:postgresql://... (Supabase pooler URL)
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # Vercel dashboard origin, e.g. https://agentguard.vercel.app
      - key: MCP_SERVER_TOKEN
        sync: false            # Use the same high-entropy value on backend and MCP service
      - key: MCP_SERVER_URL
        value: https://agentguard-mcp.onrender.com
      - key: ML_SERVICE_URL
        value: https://agentguard-ml.onrender.com
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_URL
        value: ""              # no local Ollama on Render; use Groq/Gemini keys

  - type: web
    name: agentguard-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    healthCheckPath: /health

  - type: web
    name: agentguard-mcp
    runtime: docker
    dockerfilePath: ./mcp-servers/Dockerfile
    dockerContext: ./mcp-servers
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # plain postgres://... (Supabase connection string)
      - key: MCP_SERVER_TOKEN
        sync: false            # Must match the backend's MCP_SERVER_TOKEN
